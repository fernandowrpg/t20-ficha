<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tormenta20 — Atributos</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{--r:#a31515;--d:#4a0707;--bg:#f2e8d5;--t:#2b1a14;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--t);font:15px Georgia,serif}
.w{max-width:1080px;margin:auto;padding:12px}
h1,h2,th,.l{font-family:Cinzel,Georgia,serif;color:var(--r);text-transform:uppercase;letter-spacing:.5px}
h1{margin:0;font-size:26px;text-shadow:1px 1px 0 var(--d)}h2{font-size:18px;border-bottom:2px solid var(--r);margin:18px 0 8px}
.top{background:linear-gradient(var(--d),#2a0303);padding:10px 12px;border-radius:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{color:#e63a1e;flex:1;min-width:140px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 12px;margin-top:10px}
.g label{display:block}.l{font-size:11px;display:block}
input,select,textarea{width:100%;background:transparent;border:0;border-bottom:2px solid var(--r);font:inherit;color:inherit;padding:3px 2px}
textarea{border:2px solid var(--r);border-radius:4px;background:#fff8;min-height:70px}
.top input,.top select{width:auto;background:#fff1;color:#fff;border-color:#e63a1e}.top option{color:#000}
button{background:var(--r);color:#fff;border:0;border-radius:4px;padding:6px 10px;font:700 13px Cinzel,serif;cursor:pointer}
button:hover{background:var(--d)}button.s{background:#7a5a4a}
table{width:100%;border-collapse:collapse}th{background:var(--r);color:#fff;padding:5px;font-size:12px}
td{padding:4px;text-align:center;border-bottom:1px solid #a3151555}tr:nth-child(even) td{background:#a315150d}
td:first-child{text-align:left;font-weight:700}td input{text-align:center;width:60px}
td button{padding:2px 9px}.tot{font:700 22px Cinzel,serif;color:var(--r)}.bad{color:#000;background:#f55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>*{width:auto}
.c input{width:46px;text-align:center}.pw{border:2px solid var(--r);border-radius:6px;padding:6px;margin:6px 0;background:#fff6}
.pw .row{margin:0}.pw .row input{flex:1}.pw textarea{margin-top:6px}
.chip{background:var(--r);color:#fff;border-radius:12px;padding:2px 9px}
.w{text-align:center}input,select{text-align:center}textarea,.pw textarea{text-align:left}.card{text-align:left}.row{justify-content:center}.g label{text-align:center}
.cols{display:grid;gap:14px;justify-content:center;grid-template-columns:minmax(0,720px)}
aside{width:100%;max-width:340px;justify-self:center}.cols[data-lay=top] aside{order:-1}.cols[data-lay=left] aside{order:-1}
@media(min-width:1000px){.cols[data-lay=right]{grid-template-columns:minmax(0,720px) 320px}.cols[data-lay=left]{grid-template-columns:320px minmax(0,720px)}
.cols[data-lay=left] aside,.cols[data-lay=right] aside{position:sticky;top:8px;align-self:start}}
.card{background:linear-gradient(#fbf3e2,#ead9b8);border:3px solid var(--r);border-radius:10px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--d);overflow:hidden}
.card .ch{background:linear-gradient(var(--d),#2a0303);color:#fff;padding:8px 10px;text-align:center}
.card .ch b{display:block;font:700 18px Cinzel,serif;color:#ff5a3c}.card .ch small{opacity:.85}
.card .cb{padding:8px 10px;font-size:13px}.card .ca{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;text-align:center;margin:6px 0}
.card .ca div{min-width:0}.card .ca span{display:block;font:700 10px Cinzel,serif;color:var(--r)}
.card .ca b{font:700 26px Cinzel,serif}.card .ca i{font-size:10px;opacity:.7}.card h4{margin:8px 0 2px;font:700 12px Cinzel,serif;color:var(--r);border-bottom:1px solid var(--r)}
.card .sk{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;font-size:12px}.card .sk div{display:flex;justify-content:space-between;border-bottom:1px dotted #a3151555}
.card p{margin:2px 0}.card em{display:block;font-size:12px;opacity:.85}
.md{background:var(--bg);border:3px solid var(--r);border-radius:8px;padding:10px;width:min(92vw,460px);max-height:80vh;display:flex;flex-direction:column;gap:8px}
#eg,#er{overflow:auto;flex:1;min-height:0}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:2px;align-content:start}
.gr button{background:none;font-size:24px;padding:4px;border-radius:4px}.gr button:hover{background:#a3151533}
#eg summary{cursor:pointer;font:700 14px Cinzel,serif;color:var(--r);padding:8px 4px;border-bottom:1px solid #a3151555;text-align:left}
</style></head><body><div class="w">
<div class="top"><h1>Tormenta<span style="color:#fff">20</span></h1><select id="sel" onchange="S.c=+this.value;R()"></select><select id="lay" onchange="S.lay=this.value;sv();ly()"><option value="bottom">Cartão abaixo</option><option value="top">Cartão acima</option><option value="left">Cartão à esquerda</option><option value="right">Cartão à direita</option></select><button onclick="nw()">+ Ficha</button><button class="s" onclick="dl()">Excluir</button></div>
<div class="cols" id="cols"><main>
<div class="g" id="hd"></div>

<h2>Atributos</h2>
<div class="row"><select id="mode" onchange="cur().mode=this.value;sv();rA()"><option value="p">Pontos de compra</option><option value="r">Rolagens (4d6)</option></select>
<span id="pbox">Pontos: <input type="number" id="pool" style="width:60px" onchange="cur().pool=+this.value||0;sv();rA()"></span>
<button id="rb" onclick="rl()" style="display:none">🎲 Rolar</button></div>
<div id="info" class="row"></div>
<table><thead><tr><th>Atributo</th><th>Base</th><th>Racial</th><th>Temp.</th><th>Total</th></tr></thead><tbody id="at"></tbody></table>
<div id="note" style="font-size:12px;margin-top:4px"></div>
<div id="cst" class="row c"></div>

<h2>Perícias</h2><details><summary style="cursor:pointer" class="l">Configurar perícias</summary><div id="pk"></div></details>
<h2>Poderes</h2><div id="pw"></div><button onclick="cur().pw.push({n:'',d:'',o:1});sv();rP()">+ Poder</button>

<h2>Magias</h2><div id="mg"></div><button onclick="mgs(cur()).push({n:'',c:1,cd:0,o:1});sv();rM()">+ Magia</button>

<h2>Itens</h2><div id="it"></div><div class="row"><button onclick="its(cur()).push({n:'',e:1,o:1});sv();rI()">+ Item</button><b id="is"></b></div>

<h2>Guilda Tempest</h2><div id="gt"></div>

<h2>Exportar / Importar</h2>
<div class="row"><button onclick="ex(0)">Esta ficha</button><button onclick="ex(1)">Todas</button><button onclick="gtx()">Guilda Tempest</button><button onclick="r20t()">Roll20 (JSON)</button><button onclick="r20d()">Roll20 (baixar .json)</button><button onclick="cp()">Copiar</button><button class="s" onclick="im()">Importar texto</button></div>
<textarea id="io" placeholder="O JSON exportado aparece aqui. Cole um JSON para importar." style="min-height:110px"></textarea></main><aside><div id="card" class="card"></div><div class="row" style="margin-top:8px"><button onclick="exC()">Cartão em texto</button></div>
<div class="row"><select id="fmt" style="width:auto"><option value="png">PNG</option><option value="jpeg">JPEG</option></select><button onclick="gi()">🖼 Gerar imagem</button><button id="sgb" class="s" onclick="sg()" style="display:none">Salvar arquivo</button></div>
<img id="pv" alt="Cartão" style="display:none;max-width:100%;border:2px solid var(--r);border-radius:6px"><div id="imsg" style="font-size:12px"></div></aside></div></div>
<datalist id="po"><option value="Classe"><option value="Origem"><option value="Racial"><option value="Geral"><option value="Divindade"><option value="Item"></datalist>
<div id="mod" onclick="if(event.target==this)this.style.display='none'" style="display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:center;justify-content:center"><div class="md"><div class="row"><b class="l">Escolha um emoji</b><button class="s" onclick="pk('')">Sem emoji</button><button onclick="$('mod').style.display='none'">Fechar</button></div><input id="eq" placeholder="Pesquisar: fogo, dragão, coração, bandeira, br, pele…" oninput="fe(this.value)" style="border:2px solid var(--r);border-radius:4px;padding:6px;background:#fff8;text-align:left"><div id="eg"></div><div id="er" class="gr" style="display:none"></div></div></div>
<script>
const A=['For','Des','Con','Int','Sab','Car'],L=['Força','Destreza','Constituição','Inteligência','Sabedoria','Carisma'],
F=[['nome','Nome do personagem'],['jogador','Jogador'],['raca','Raça'],['origem','Origem'],['classe','Classe'],['xp','XP'],['nivel','Nível'],['div','Divindade'],['dist','Distinção']],
$=i=>document.getElementById(i),cur=()=>S.s[S.c],
mk=n=>({t:'Treinador '+n,f:{},mode:'p',pool:10,costs:{'-1':-1,0:0,1:1,2:2,3:4,4:7},base:[0,0,0,0,0,0],rac:[0,0,0,0,0,0],tmp:[0,0,0,0,0,0],mg:[],pe:{},of:['',''],roll:[],raw:[],pw:[]}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('t20'))}catch(e){}
if(!S||!S.s||!S.s.length)S={s:[mk(1)],c:0};
const sv=()=>{try{localStorage.setItem('t20',JSON.stringify(S))}catch(e){}rC()};
function ly(){S.lay=S.lay||'right';$('cols').dataset.lay=S.lay;$('lay').value=S.lay}
const tot=(s,i)=>s.base[i]+(+s.rac[i]||0)+(+(s.tmp||[])[i]||0);
function nw(){S.s.push(mk(S.s.length+1));S.c=S.s.length-1;R()}
function dl(){if(!confirm('Excluir esta ficha?'))return;S.s.splice(S.c,1);if(!S.s.length)S.s.push(mk(1));S.c=0;R()}
function R(){sv();const s=cur();
$('sel').innerHTML=S.s.map((x,i)=>`<option value="${i}" ${i==S.c?'selected':''}>${esc(x.t)}</option>`).join('');
$('hd').innerHTML=`<label style="grid-column:1/-1"><span class=l>Título da ficha</span><input value="${esc(s.t)}" oninput="cur().t=this.value;sv();$('sel').options[S.c].text=this.value"></label>`+
F.map(([k,n])=>`<label><span class=l>${n}</span><input value="${esc(s.f[k])}" oninput="cur().f['${k}']=this.value;sv();${k=='nivel'?'rK()':''}"></label>`).join('');
$('mode').value=s.mode;ly();rA();rP();rM();rK();rG();rI()}
function rA(){const s=cur(),p=s.mode=='p';let sp=0,sum=0;
$('pbox').style.display=$('cst').style.display=p?'':'none';$('rb').style.display=p?'none':'';$('pool').value=s.pool;
$('at').innerHTML=A.map((a,i)=>{const b=s.base[i];sp+=+s.costs[b]||0;sum+=b;
const c=p?`<button onclick="st(${i},-1)">−</button> <b>${b}</b> <button onclick="st(${i},1)">+</button>`:
`<select style="width:60px" onchange="s2(${i},this.value)">${(s.roll.length?s.roll:[b]).map(v=>`<option ${v==b?'selected':''}>${v}</option>`).join('')}</select>`;
const t=tot(s,i);
return `<tr><td>${L[i]}</td><td>${c}</td><td><input type=number value="${+s.rac[i]||0}" onchange="cur().rac[${i}]=+this.value;sv();rA()"></td><td><input type=number value="${+(s.tmp||[])[i]||0}" onchange="(cur().tmp=cur().tmp||[0,0,0,0,0,0])[${i}]=+this.value;sv();rA()"></td><td class="tot ${t<-5?'bad':''}">${t}</td></tr>`}).join('');
$('info').innerHTML=p?`<span class=chip>Gastos: ${sp}</span><span class=chip>Restantes: ${s.pool-sp}</span>`:
`<span class=chip>Soma das bases: ${sum}</span>${s.raw.length?'<span>Rolagens: '+s.raw.join(', ')+' → '+s.roll.join(', ')+'</span>':''}`;
$('note').textContent=p?'Reduzir um atributo a −1 devolve 1 ponto. Temp.: bônus ou penalidade temporária, somada ao total. Total abaixo de −5 gera efeito (paralisado, morre, inconsciente ou NPC).':'Distribua os valores como quiser; a soma deve ser pelo menos 6 (senão role de novo o menor valor).';
$('cst').innerHTML='<span class=l>Custos:</span>'+[-1,0,1,2,3,4].map(v=>`<label>${v>0?'+':''}${v}→<input type=number value="${s.costs[v]}" onchange="cur().costs[${v}]=+this.value;sv();rA()"></label>`).join('');sv();rK()}
function st(i,d){const s=cur(),v=s.base[i]+d;if(v<-1||v>4)return;s.base[i]=v;rA()}
function s2(i,v){cur().base[i]=+v;rA()}
function rl(){const s=cur(),d=()=>{const r=[0,0,0,0].map(()=>1+Math.random()*6|0).sort();return r[1]+r[2]+r[3]},
cv=n=>Math.max(-2,Math.floor((n-10)/2));let r=[1,2,3,4,5,6].map(d);
while(r.map(cv).reduce((a,b)=>a+b)<6){r[r.indexOf(Math.min(...r))]=d()}
s.raw=r;s.roll=r.map(cv);s.base=s.roll.slice();rA()}
function rP(){$('pw').innerHTML=cur().pw.map((p,i)=>`<div class=pw><div class=row><button class=s style="font-size:18px;padding:2px 8px" onclick="pe(${i})">${p.e||'🙂'}</button><input value="${esc(p.n)}" placeholder="Nome do poder" oninput="cur().pw[${i}].n=this.value;sv()"><input list=po style="max-width:230px" value="${esc(p.f)}" placeholder="Origem (classe nv, origem, racial…)" oninput="cur().pw[${i}].f=this.value;sv()"><button onclick="cur().pw[${i}].o^=1;sv();rP()">${p.o?'▲':'▼'}</button><button class=s onclick="cur().pw.splice(${i},1);sv();rP()">✕</button></div>${p.o?`<textarea placeholder="Descrição" oninput="cur().pw[${i}].d=this.value;sv()">${esc(p.d)}</textarea>`:''}</div>`).join('')}
const SKS=[['acrobacia','Acrobacia','des'],['adestramento','Adestramento','car'],['atletismo','Atletismo','for'],['atuacao','Atuação','car'],['cavalgar','Cavalgar','des'],['conhecimento','Conhecimento','int'],['cura','Cura','sab'],['diplomacia','Diplomacia','car'],['enganacao','Enganação','car'],['fortitude','Fortitude','con'],['furtividade','Furtividade','des'],['guerra','Guerra','int'],['iniciativa','Iniciativa','des'],['intimidacao','Intimidação','car'],['intuicao','Intuição','sab'],['investigacao','Investigação','int'],['jogatina','Jogatina','car'],['ladinagem','Ladinagem','des'],['luta','Luta','for'],['misticismo','Misticismo','int'],['nobreza','Nobreza','int'],['oficio','Ofício','int'],['oficio2','Ofício 2','int'],['percepcao','Percepção','sab'],['pilotagem','Pilotagem','des'],['pontaria','Pontaria','des'],['reflexos','Reflexos','des'],['religiao','Religião','sab'],['sobrevivencia','Sobrevivência','sab'],['vontade','Vontade','sab']],
AT=['for','des','con','int','sab','car'];
const sgn=t=>t>0?'+'+t:''+t;
function skl(s){const n=+s.f.nivel||1,h=n>>1,tr=n>=15?6:n>=7?4:2,pe=s.pe||{};return SKS.map(([k,nm,d])=>{const e=pe[k]||{},a=e.a||d,of=k=='oficio'?(s.of||[])[0]:k=='oficio2'?(s.of||[])[1]:'';
return{nm:nm+(of?` (${of})`:''),t:h+tot(s,AT.indexOf(a))+(e.t?tr:0)+(+e.o||0),tr:!!e.t}})}
function ku(k,f,v){const s=cur();(s.pe[k]=s.pe[k]||{})[f]=v;sv();rK()}
function rK(){const s=cur(),n=+s.f.nivel||1,h=n>>1,tr=n>=15?6:n>=7?4:2;s.pe=s.pe||{};s.of=s.of||['',''];
$('pk').innerHTML=`<div class=row>${[0,1].map(i=>`<label>Ofício${i?' 2':''}: <input value="${esc(s.of[i])}" placeholder="Nome do ofício" oninput="cur().of[${i}]=this.value;sv()"></label>`).join('')}</div><table><thead><tr><th>Perícia</th><th>Atrib.</th><th>Trein.</th><th>Outros</th><th>Total</th></tr></thead><tbody>`+
SKS.map(([k,nm,d])=>{const e=s.pe[k]||{},a=e.a||d,t=h+tot(s,AT.indexOf(a))+(e.t?tr:0)+(+e.o||0);
return `<tr><td>${nm}</td><td><select style="width:auto" onchange="ku('${k}','a',this.value)">${AT.map(x=>`<option ${x==a?'selected':''}>${x}</option>`).join('')}</select></td><td><input type=checkbox style="width:auto" ${e.t?'checked':''} onchange="ku('${k}','t',this.checked?1:0)"></td><td><input type=number value="${+e.o||0}" onchange="ku('${k}','o',+this.value)"></td><td class=tot style="font-size:18px">${t>0?'+'+t:t}</td></tr>`}).join('')+'</tbody></table><div style="font-size:12px">Total = ½ nível + atributo + treino (+2 / +4 / +6 nos níveis 1 / 7 / 15) + outros.</div>'}
const FN=['Tank','Healer','Support','DPS','Especialista','Debuffer','Bruiser','All Rounder'],
gg=s=>s.g||(s.g={slot:'01',pea:'1.0',tib:'T$ 600',fn:[],desc:'',bg:'',img:''});
function gu(k,v){gg(cur())[k]=v;sv()}
function gf(n,c){const g=gg(cur());let m='';g.fn=g.fn.filter(x=>x!=n);if(c)g.fn.push(n);if(g.fn.length>2){g.fn.pop();m='Máximo de duas funções.'}sv();rG();$('gmsg').textContent=m}
function rG(){const g=gg(cur());$('gt').innerHTML=`<div class=g><label><span class=l>Slot de personagem</span><select onchange="gu('slot',this.value)">${['01 · primário','02 · secundário','03 · terciário','04','05'].map(o=>`<option value="${o.slice(0,2)}" ${g.slot==o.slice(0,2)?'selected':''}>${o}</option>`).join('')}</select></label>
<label><span class=l>PeA</span><input value="${esc(g.pea)}" oninput="gu('pea',this.value)"></label>
<label><span class=l>Tibares</span><input value="${esc(g.tib)}" oninput="gu('tib',this.value)"></label>
<label style="grid-column:1/-1"><span class=l>Imagem do personagem (link)</span><input value="${esc(g.img)}" placeholder="https://… (obrigatória ao publicar)" oninput="gu('img',this.value)"></label></div>
<div class=row><span class=l>Função primária (até 2):</span>${FN.map(n=>`<label><input type=checkbox style="width:auto" ${g.fn.includes(n)?'checked':''} onchange="gf('${n}',this.checked)"> ${n}</label>`).join(' ')}</div><div id=gmsg style="font-size:12px"></div>
<span class=l>Descrição breve</span><textarea oninput="gu('desc',this.value)">${esc(g.desc)}</textarea><span class=l>Background (opcional)</span><textarea oninput="gu('bg',this.value)">${esc(g.bg)}</textarea>`}
function gtx(){const s=cur(),f=s.f,g=gg(s),n=String(f.nivel||3).padStart(2,'0'),ti=[f.nome||s.t,n,f.classe].filter(Boolean).join(' - ')+(f.dist?' • '+f.dist:'');
$('io').value=[`Título: ${ti}`,'',`Imagem: ${g.img||'(ATENÇÃO: adicione a imagem do personagem!)'}`,'',`Nome: ${f.nome||''}`,`Jogador: ${f.jogador||''}`,`Slot de Personagem: ${g.slot}`,`Raça: ${f.raca||''}`,`Devoção: ${f.div||''}`,`Origem: ${f.origem||''}`,`Classe: ${[f.classe,f.dist].filter(Boolean).join(' / ')}`,`Nível: ${n}`,`PeA: ${g.pea}`,`Tibares: ${g.tib}`,`Função Primária: ${g.fn.join(', ')}`,'',`Descrição Breve: ${g.desc}`,'',`Background: ${g.bg}`].join('\n');$('io').scrollIntoView()}
const its=s=>s.it||(s.it=[]),tsp=s=>Math.round(its(s).reduce((a,i)=>a+(+i.e||0),0)*10)/10,
EQK={n:'nameequipment',e:'equipmentespaco',d:'equipmentdescription'};
function iu(i,k,v){its(cur())[i][k]=v;sv();$('is').textContent='Espaços usados: '+tsp(cur())}
function rI(){$('it').innerHTML=its(cur()).map((m,i)=>`<div class=pw><div class=row><input value="${esc(m.n)}" placeholder="Nome do item" oninput="iu(${i},'n',this.value)"><label>Espaço <input type=number step=0.5 style="width:70px" value="${+m.e||0}" onchange="iu(${i},'e',this.value)"></label><button onclick="its(cur())[${i}].o^=1;sv();rI()">${m.o?'▲':'▼'}</button><button class=s onclick="its(cur()).splice(${i},1);sv();rI()">✕</button></div>${m.o?`<textarea placeholder="Descrição" oninput="iu(${i},'d',this.value)">${esc(m.d)}</textarea>`:''}</div>`).join('');$('is').textContent='Espaços usados: '+tsp(cur())}
function r20(){const s=cur(),f=s.f,z='0',at=['for','des','con','int','sab','car'],
nt=[f.dist&&'Distinção: '+f.dist,f.xp&&'XP: '+f.xp].filter(Boolean).join('\n'),
o={isJDA:true,playername:f.jogador||'',trace:f.raca||'',torigin:f.origem||'',tlevel:f.classe||'',charnivel:String(f.nivel||1)};
at.forEach((a,i)=>o[a]=String(s.base[i]+(+s.rac[i]||0)));
